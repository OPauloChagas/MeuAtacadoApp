name: Local checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.1
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.1
      - run: npm ci
      - run: docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 meuatacado-local
      - name: Start local Supabase without logging generated keys
        run: npm run db:start > /dev/null
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run db:test
      - run: npm run test:identity
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:reset
      - run: npm run test:auth
      - run: npm run db:reset
      - run: npm run test:admin
      - run: npm run db:reset
      - run: npm run test:customers
      - run: npm run db:reset
      - run: npm run test:products
      - run: npm run db:reset
      - run: npm run test:commercial
      - run: npm run db:reset
      - run: npm run test:catalog
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
